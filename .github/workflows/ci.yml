name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate test database credential
        run: echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(24))')" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Start integration infrastructure
        run: docker compose -p dips-ci-integration up -d --wait postgres kafka topic-init

      - name: Run integration tests
        run: >-
          docker compose -p dips-ci-integration run --rm --build
          -e TEST_DATABASE_URL=postgresql+psycopg://image_app:${POSTGRES_PASSWORD}@postgres:5432/image_processing
          -e TEST_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          api python -m pytest tests/integration -q -p no:cacheprovider

      - name: Run Docker Compose end-to-end test
        run: python -m pytest tests/e2e -q

      - name: Collect integration container logs
        if: failure()
        run: docker compose -p dips-ci-integration logs --no-color

      - name: Clean up test containers and volumes
        if: always()
        run: docker compose -p dips-ci-integration down -v --remove-orphans
