<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Image processing</title></head>
<body>
  <main>
    <h1>Convert an image to grayscale</h1>
    <form action="/jobs" method="post" enctype="multipart/form-data">
      <label for="upload">JPEG or PNG image</label>
      <input id="upload" name="upload" type="file" accept="image/jpeg,image/png" required>
      <button type="submit">Process image</button>
    </form>
  </main>
</body>
</html>
